name: React Generate Page Package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Publishing used to happen with no tests in front of it. It does not any more:
  # a red suite blocks the release.
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  publish:
    name: Package Build & Publish
    needs: test
    runs-on: ubuntu-latest
    # Job-level, so every yarn invocation sees it. Setting it per-step is what
    # broke CI: .yarnrc.yml reads it on every call, not just during install.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_KEY_NPM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@mj_yu'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Publish to npm
        run: yarn npm publish --access public
