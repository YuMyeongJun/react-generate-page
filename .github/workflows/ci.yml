name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 18. This matrix is what makes
        # that a measurement rather than a claim.
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      # No NODE_AUTH_TOKEN anywhere in this workflow: nothing here talks to a
      # registry that needs one. .yarnrc.yml used to demand it on every yarn
      # invocation, which failed every step after install; it now defaults to
      # empty.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: The published bin must exist at the path package.json points at
        run: |
          test -f dist/generate-page.js
          node dist/generate-page.js --version
          node dist/generate-page.js --help > /dev/null
