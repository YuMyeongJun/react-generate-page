name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 18. This matrix is what makes
        # that a measurement rather than a claim.
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          # .yarnrc.yml interpolates this for the @mj_yu scope. Installing needs
          # no credentials, but the variable has to exist.
          NODE_AUTH_TOKEN: unused-for-install

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: unused-for-install
      - name: Build
        run: yarn build
      - name: The published bin must exist at the path package.json points at
        run: |
          test -f dist/generate-page.js
          node dist/generate-page.js --version
          node dist/generate-page.js --help > /dev/null
