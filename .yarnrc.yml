
nodeLinker: node-modules

npmScopes:
  mj_yu:
    npmAlwaysAuth: true
    npmPublishRegistry: 'https://npm.pkg.github.com'
    npmRegistryServer: "https://npm.pkg.github.com"
    # ${VAR:-} rather than ${VAR}: yarn interpolates this file on *every*
    # invocation, so the bare form made `yarn test` and `yarn build` fail with
    # "Environment variable not found" for anyone without a publish token -
    # including CI, which only needs one to publish.
    npmAuthToken: "${NODE_AUTH_TOKEN:-}"

yarnPath: .yarn/releases/yarn-4.8.1.cjs
